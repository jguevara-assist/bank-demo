# deploy/secret.yaml
# Secreto para las credenciales del servidor MCP.
# Aplica ANTES del Deployment:
#   oc apply -f deploy/secret.yaml -n demo-bank
#
# NUNCA edites valores directamente aquí. Usa oc create secret o la consola
# de OpenShift para poblar los valores reales.
# Los valores abajo son placeholders en base64 de cadenas vacías.
#
# Para crear el secreto desde la CLI con valores reales:
#   oc create secret generic banco-demo-mcp-secrets \
#     --from-literal=MCP_BEARER_TOKEN="$(openssl rand -base64 32)" \
#     --from-literal=BANK_API_KEY="tu-bank-api-key-si-aplica" \
#     -n demo-bank
#
# Para actualizar el bearer token:
#   oc create secret generic banco-demo-mcp-secrets \
#     --from-literal=MCP_BEARER_TOKEN="nuevo-token" \
#     --from-literal=BANK_API_KEY="" \
#     -n demo-bank --dry-run=client -o yaml | oc apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: banco-demo-mcp-secrets
  namespace: demo-bank
  labels:
    app: banco-demo-mcp
type: Opaque
stringData:
  # Reemplaza con valores reales usando oc create secret (ver instrucciones arriba)
  MCP_BEARER_TOKEN: ""
  BANK_API_KEY: ""
