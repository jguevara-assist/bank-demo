---
# deploy/service.yaml — Service interno para el servidor MCP.
apiVersion: v1
kind: Service
metadata:
  name: banco-demo-mcp
  namespace: demo-bank
  labels:
    app: banco-demo-mcp
spec:
  selector:
    app: banco-demo-mcp
  ports:
    - name: mcp-http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
# deploy/buildconfig.yaml — BuildConfig para construir la imagen del servidor MCP.
# Ejecuta: oc start-build banco-demo-mcp -n demo-bank --follow
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: banco-demo-mcp
  namespace: demo-bank
  labels:
    app: banco-demo-mcp
spec:
  source:
    type: Git
    git:
      uri: https://github.com/jguevara-assist/bank-demo
      ref: main
    contextDir: banco_demo/mcp_server
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: banco-demo-mcp:latest
  runPolicy: Serial
---
# deploy/imagestream.yaml
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: banco-demo-mcp
  namespace: demo-bank
  labels:
    app: banco-demo-mcp
spec:
  lookupPolicy:
    local: true
